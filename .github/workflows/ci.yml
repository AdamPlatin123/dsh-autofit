# Every PR and every push to main; release.yml also runs it on the tag before publishing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, dsh ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 0.2.1 is the oldest DSH whose bin.js needs import.meta.main (Node ≥22.18); latest needs Node ≥24.9.
          - { os: ubuntu-latest, node: 22, dsh: 0.2.1-rc.2 }
          - { os: ubuntu-latest, node: 24, dsh: latest }
          - { os: windows-latest, node: 22, dsh: 0.2.1-rc.2 }
          - { os: windows-latest, node: 24, dsh: latest }
          # The runtime DSH Desktop embeds.
          - { os: ubuntu-latest, node: 24, dsh: 0.1.5-rc.2 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Without a global dsh the format-1 validator and describe() tests skip instead of running.
      - run: npm install -g @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: npm test

  package:
    name: package (${{ matrix.os }}, pnpm ${{ matrix.pnpm }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pnpm 9 is the one that refuses `add` in the profile workspace without -w.
          - { os: ubuntu-latest, pnpm: latest }
          - { os: windows-latest, pnpm: 9 }
    defaults:
      run:
        # On Windows this is Git Bash, so GNU tar and npm's sh shims come first on PATH, as for CLI users there.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # DSH installs plugins with pnpm and expects it on PATH; runners have none.
      - run: npm install -g @deepseek-ai/dsh pnpm@${{ matrix.pnpm }}
      - run: node scripts/check-release.mjs
      - name: Install the packed tarball
        run: |
          tgz="$PWD/$(npm pack --silent --ignore-scripts)"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"
          npm install -g "$tgz"
      - run: dsh-autofit host
      # The package trial-installs itself into a throwaway DSH home; runners ship Chrome, so L2 client runs too.
      - name: Probe the packed tarball
        run: |
          code=0; dsh-autofit probe "$TGZ" --json > probe.json || code=$?
          node -e 'const r=require("./probe.json"); console.log(r.verdict, r.codes); for (const [k, v] of Object.entries(r.layers ?? {})) console.log(k, v.status, v.error ?? "", "\n" + (v.logTail ?? ""))'
          exit $code
