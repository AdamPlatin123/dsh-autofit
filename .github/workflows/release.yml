# Push a tag made by `npm version` (v0.3.12, v0.4.0-rc.1, ...) to publish it.
# npm trusts this workflow through OIDC (trusted publishing): no token is stored anywhere, and the
# package gets a provenance attestation tying it to this repository, workflow and commit.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher; give it a required reviewer to approve each release.
    environment: npm
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm ≥ 11.5.1.
      - run: npm install -g npm@^11.5.1
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # prepublishOnly runs scripts/check-release.mjs --publish and the tests; with dsh they skip nothing.
      - run: npm install -g @deepseek-ai/dsh
      - name: Publish (prereleases to next, others to latest)
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --tag "$tag"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre
